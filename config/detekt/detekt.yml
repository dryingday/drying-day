# Overrides on top of detekt's default config (buildUponDefaultConfig).
naming:
  FunctionNaming:
    # Composables are named like types.
    ignoreAnnotated: ['Composable']
    # detekt's default excludes (copied: setting excludes replaces them, so recheck on a detekt upgrade),
    # shared's androidHostTest test sources, and Compose's generated resource accessors, which the
    # type-resolved tasks analyse along with our code so that references to them resolve.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**',
      '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/androidHostTest/**',
      '**/build/generated/compose/**']
style:
  MaxLineLength:
    # Compose's generated resource accessors (see FunctionNaming).
    excludes: ['**/build/generated/compose/**']
  UnusedImport:
    # Off by default. ktlint's no-unused-imports lets unused imports through here (tested with 1.8.0),
    # and ktlint has marked it for removal in 2.0, so detekt checks imports instead. It needs type
    # resolution, so only the type-resolved tasks that check runs (see build.gradle.kts) apply it.
    active: true
